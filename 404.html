<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page déplacée — Endam Digital</title>
<meta name="robots" content="noindex">
<script>
  // Anciennes adresses de endam-digital.com (ex-site PronoFoot) : on renvoie
  // vers le même chemin sur pronofoot.endam-digital.com.
  (function () {
    var p = location.pathname + location.search + location.hash;
    if (p && p !== "/" && p !== "/404.html") {
      location.replace("https://pronofoot.endam-digital.com" + p);
    }
  })();
</script>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{--bg:#0b0e14;--text:#e9edf5;--muted:#8e98ab;--line:#232a37}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:
    radial-gradient(600px 400px at 20% 0%,rgba(63,216,245,.12),transparent 70%),
    radial-gradient(600px 400px at 90% 100%,rgba(154,92,255,.14),transparent 70%),var(--bg);
    color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;text-align:center}
  img{width:200px;height:auto;-webkit-mask-image:radial-gradient(ellipse 58% 56% at 50% 48%,#000 45%,transparent 100%);mask-image:radial-gradient(ellipse 58% 56% at 50% 48%,#000 45%,transparent 100%)}
  h1{font-size:clamp(26px,5vw,36px);margin:8px 0 10px}
  p{color:var(--muted);max-width:460px;margin:0 auto}
  .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
  a{padding:12px 20px;border-radius:12px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:600}
  a.main{background:linear-gradient(100deg,#3fd8f5,#4f7cff 50%,#9a5cff);border:0;color:#0b0e14}
</style>
</head>
<body>
  <main>
    <img src="/logo-endam.png" alt="Endam Digital" width="332" height="246">
    <h1>Cette page a déménagé</h1>
    <p>Tu cherchais peut-être PronoFoot : il a maintenant sa propre adresse. Sinon, retrouve tous les projets sur la page d'accueil.</p>
    <div class="links">
      <a class="main" href="https://pronofoot.endam-digital.com">Aller sur PronoFoot</a>
      <a href="/">Tous les projets</a>
    </div>
  </main>
</body>
</html>
